name: Build & Deploy Blazor Server App

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Brahmsnet

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FlomiApp.sln

      - name: Tests
        run: dotnet test FlomiApp.sln --no-restore --configuration Release

      - name: Publish
        run: |
          dotnet publish ./FlomiApp.csproj \
            -c Release \
            --self-contained \
            -o ./publish \
            -p:TreatWarningsAsErrors=false

      - name: SSH einrichten, Deploy & Restart
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p $HOME/.ssh
          chmod 700 $HOME/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > $HOME/.ssh/id_ed25519
          chmod 600 $HOME/.ssh/id_ed25519

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> $HOME/.ssh/known_hosts

          CONFIG="          
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/id_ed25519
            StrictHostKeyChecking no"
          
                    printf '%s\n' "$CONFIG" > $HOME/.ssh/config
                    chmod 600 $HOME/.ssh/config
          
                    echo "HOME ist: $HOME"
                    echo "Config existiert: $(ls -la $HOME/.ssh/config)"
          
                    rsync -avz --delete \
                      -e "ssh -F $HOME/.ssh/config" \
                      ./publish/ \
                      target:/var/www/webapp/
          
                    ssh -F $HOME/.ssh/config target "sudo systemctl restart flomi"
