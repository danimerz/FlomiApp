name: Deploy flomiapp

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test FlomiApp.sln -c Release

      - name: Publish
        run: dotnet publish FlomiApp.csproj -c Release -o publish

      - name: ZIP erstellen
        run: cd publish && zip -qr ../app.zip .

      - name: ZIP-Inhalt prüfen
        run: unzip -l app.zip | grep -i flomi

      - name: Deploy auf apps.familie-merz.ch
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.APPMGR_TOKEN }}" \
            -H "X-Deploy-Ref: ${GITHUB_SHA::7}" \
            -H "Content-Type: application/zip" \
            --data-binary @app.zip \
            https://apps.familie-merz.ch/api/deploy/flomiapp
